name: OpenAPI Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'src/**'
      - 'example/**'
      - '__tests__/**'
      - 'vacuum.conf.yaml'
      - '*.oas.rules.*'
      - 'package.json'
      - 'tsconfig.json'
      - 'jest.config.*'
    branches:
      - main

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      contents: read
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      run_ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ci:
              - 'src/**'
              - 'example/**'
              - '__tests__/**'
              - 'vacuum.conf.yaml'
              - '*.oas.rules.*'
              - 'package.json'
              - 'tsconfig.json'
              - 'jest.config.*'

  lint-example-openapi:
    name: Lint Example OpenAPI
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ruleset and Vacuum functions
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run

      # vacuum-action@v2 cannot be used in this organisation because the
      # composite action embeds peter-evans actions that are not allowlisted.
      # Use the same official Vacuum image directly so linting remains pinned
      # to the reviewed release without introducing prohibited nested actions.
      - name: Lint example OpenAPI specifications
        run: |
          docker run --rm \
            --volume "${PWD}:/work" \
            --workdir /work \
            dshanley/vacuum:v0.35.4 \
            lint example/example.1.0.0.oas.yml \
            --ruleset ukhsa.oas.rules.yml \
            --functions dist/functions \
            --resolve-all-refs \
            --nested-refs-doc-context \
            --no-style

  run-typescript-tests:
    name: Run Tests
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript tests with coverage
        run: npm run test

      - name: Upload Jest coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      - name: Publish Jest test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: coverage/junit.xml
