extends:
  - ./zalando.oas.rules.yml
  - [vacuum:oas, recommended]

documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/

functions:
  - isApiInfoJsonSchema
  - hasRequiredProblemDetailsErrorResponses

functionsDir: dist/functions

rules:
  oas3-api-servers: off
  must-have-info-x-api-id: off
  must-always-return-json-objects-as-top-level-data-structures: warn
  should-not-use-api-as-base-path: off

  # MUST Properties must use lower camel case.
  # => /docs/linting-rules/must/must-use-camel-case-for-property-names.md

  must-use-snake-case-for-property-names: off
  must-use-camel-case-for-property-names: &must-use-camel-case-for-property-names
    given: $.paths.*.*['responses','requestBody']..content..schema..properties[?(@root.info["x-api-type"] !== "pygeoapi")]~
    severity: error
    then:
      function: casing
      functionOptions:
        type: camel
    recommended: true
    description: Properties must use lower camel case.
    message: Properties must use lower camel case.
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-use-camel-case-for-property-names/

  # MUST Query parameters must use lower camel case.
  # => /docs/linting-rules/must/must-use-camel-case-for-query-parameters.md

  must-use-snake-case-for-query-parameters: off
  must-use-camel-case-for-query-parameters: &must-use-camel-case-for-query-parameters
    given: $.paths.*.*.parameters[?(@ && @.in=='query' && @root.info["x-api-type"] !== "pygeoapi")].name
    severity: error
    then:
      function: casing
      functionOptions:
        type: camel
    recommended: true
    description: Query parameters must use lower camel case.
    message: Query parameters must use lower camel case.
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-use-camel-case-for-query-parameters/

  # MUST The `info` object must have an `x-audience` that matches at least one of these values: company-internal, partner-external, premium-external or public-external.
  # => /docs/linting-rules/must/must-have-info-api-audience.md

  must-provide-api-audience: off
  must-have-info-api-audience-defined: &must-have-info-api-audience-defined
    given: $.info[?(@property === "title" && @root.info["x-api-type"] !== "pygeoapi")]^
    severity: error
    then:
      function: defined
      field: x-audience
    recommended: true
    description: 'The `info` object must have an `x-audience` that matches at least one of these values: company-internal, partner-external, premium-external or public-external.'
    message: 'Missing `info.x-audience`.'
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-have-info-api-audience/

  must-have-info-api-audience: &must-have-info-api-audience
    given: $.info[?(@property === "title" && @root.info["x-api-type"] !== "pygeoapi")]^
    severity: error
    then:
      function: schema
      field: x-audience
      functionOptions:
        interpolateErrorMessage: true
        schema:
          type: string
          enum:
            - company-internal
            - partner-external
            - premium-external
            - public-external
    recommended: true
    description: 'The `info` object must have an `x-audience` that matches at least one of these values: company-internal, partner-external, premium-external or public-external.'
    message: 'Missing or wrong `info.x-audience`, {{error}}.'
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-have-info-api-audience/

  # MUST Path must start with a slash and must not end with a slash.
  # => /docs/linting-rules/must/must-use-normalized-paths.md

  must-use-normalized-paths-without-trailing-slash: off
  must-use-normalized-paths:
    given: $.paths.*~
    severity: error
    then:
      function: pattern
      functionOptions:
        match: ^\/($|[^\/].*[^\/]$)
    description: "Path must start with a slash and must not end with a slash (except root path '/')"
    message: "Path must start with a slash and must not end with a slash (except root path '/')"
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-use-normalized-paths/

  # SHOULD APIs SHOULD have a root path (`/`) defined.
  # => /docs/linting-rules/must/should-define-api-root.md

  should-define-api-root:
    given: $.paths
    severity: warn
    then:
      field: /
      function: truthy
    recommended: true
    description: Good documentation is always welcome, but API consumers should be able to get a pretty long way through interaction with the API alone. They should at least know they're looking at the right place instead of getting a 404 or random 500 error as is common in some APIs.
    message: APIs SHOULD have a root path (`/`) defined.
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/should/should-define-api-root/

  # MUST Root path must define a 200 response..
  # => /docs/linting-rules/must/must-return-200-for-api-root.md

  must-return-200-for-api-root:
    given: $.paths["/"].*.responses
    severity: error
    then:
      field: '200'
      function: truthy
    recommended: true
    description: 'Root path must define a 200 response.'
    message: 'Root path must define a 200 response.'
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-return-200-for-api-root/

  # MUST `ApiInfo` schema must include this set of minimal required properties and validations.
  # => /docs/linting-rules/must/must-use-valid-version-info-schema.md

  must-use-valid-version-info-schema: &must-use-valid-version-info-schema
    given: $.paths["/"].*.responses["200"].content[?(@property === "application/json" && @root.info["x-api-type"] !== "pygeoapi")]
    severity: error
    then:
      function: isApiInfoJsonSchema
      field: schema
    recommended: true
    description: '`ApiInfo` schema must include this set of minimal required properties and validations.'
    message: '{{error}}'
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-use-valid-version-info-schema/

  # MUST The `info` object must have an `x-value-chain` that matches at least one of these values: prevent, detect, analyse, respond, cross-cutting or enabling.
  # => /docs/linting-rules/must/must-have-info-value-chain.md

  must-have-info-value-chain-defined: &must-have-info-value-chain-defined
    given: $.info[?(@property === "title" && @root.info["x-api-type"] !== "pygeoapi")]^
    severity: error
    then:
      function: defined
      field: x-value-chain
    recommended: true
    description: 'The `info` object must have an `x-value-chain` that matches at least one of these values: prevent, detect, analyse, respond, cross-cutting or enabling.'
    message: 'Missing `info.x-value-chain`.'
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-have-info-value-chain/

  must-have-info-value-chain: &must-have-info-value-chain
    given: $.info[?(@property === "title" && @root.info["x-api-type"] !== "pygeoapi")]^
    severity: error
    then:
      function: schema
      field: x-value-chain
      functionOptions:
        interpolateErrorMessage: true
        schema:
          type: string
          enum:
            - prevent
            - detect
            - analyse
            - respond
            - cross-cutting
            - enabling
    recommended: true
    description: 'The `info` object must have an `x-value-chain` that matches at least one of these values: prevent, detect, analyse, respond, cross-cutting or enabling.'
    message: 'Missing or wrong `info.x-value-chain`, {{error}}.'
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-have-info-value-chain/

  # MUST ALL requests MUST go through `https` protocol only
  # => /docs/linting-rules/must/must-use-https-protocol-only.md

  must-use-https-protocol-only: &must-use-https-protocol-only
    given: $.servers..[?(@property === "url" && @root.info["x-api-type"] !== "pygeoapi")]
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^https:/"
    recommended: true
    description: ALL requests MUST go through `https` protocol only
    message: Servers MUST be `https` and no other protocol is allowed.
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-use-https-protocol-only/

  # MUST APIs MUST NOT use `HTTP` Basic Authentication.
  # => /docs/linting-rules/must/must-not-use-http-basic-authentication.md

  must-not-use-http-basic-authentication:
    given: $.components.securitySchemes[*]
    severity: error
    then:
      field: scheme
      function: pattern
      functionOptions:
        notMatch: basic
    recommended: true
    message: APIs MUST NOT use `HTTP` Basic Authentication.
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-not-use-http-basic-authentication/
    description: >-
      HTTP Basic is an inherently insecure way to pass credentials to the API. They're placed in the URL in base64 which can be decrypted easily. Even if you're using a token, there are far better ways to handle passing tokens to an API which are less likely to leak.


      See OWASP advice. https://owasp.org/API-Security/editions/2019/en/0xa2-broken-user-authentication/

  # SHOULD Every request SHOULD support `application/json` media type.
  # => /docs/linting-rules/should/should-support-application-json-content-request-body.md

  should-support-application-json-content-request-body:
    given: $.paths[*][*].requestBody.content
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            application/json: true
          required:
            - application/json
    recommended: true
    description: Every request SHOULD support at least one `application/json` content type
    message: Every request SHOULD support at least one `application/json` content type.
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/should/should-support-application-json-content-request-body/

  # MUST A GET request MUST NOT accept a request body.
  # => /docs/linting-rules/must/must-not-define-request-body-for-get-requests.md

  must-not-define-request-body-for-get-requests:
    given: $.paths..get.requestBody
    severity: error
    then:
      function: undefined
    recommended: true
    description: Defining a request body on a HTTP GET is in some implementations, but is increasingly frowned upon due to the confusion that comes from unspecified behavior in the HTTP specification.
    message: A GET request MUST NOT accept a request body.
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-not-define-request-body-for-get-requests/

  # MUST All APIs MUST have a security scheme defined.
  # => /docs/linting-rules/must/must-define-security-schemes.md

  must-define-security-schemes: &must-define-security-schemes
    given: $..[?(@property === "components" && @root.info["x-api-type"] !== "pygeoapi")]
    severity: error
    then:
      field: securitySchemes
      function: truthy
    recommended: true
    description: This API definition does not have any security scheme defined, which means the entire API is open to the public. That's probably not what you want, even if all the data is read-only. Setting lower rate limits for the public and letting known consumers use more resources is a handy path to monetization, and helps know who your power users are when changes need feedback or migration, even if not just good practice.
    message: All APIs MUST have a security scheme defined.
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-define-security-schemes/

  # SHOULD `201 Created` responses to `POST` methods SHOULD have a `Location` header identifying the location of the newly created resource.
  # => /docs/linting-rules/should/should-have-location-header-in-201-response.md

  should-have-location-header-in-201-response:
    given: $.paths..post.responses["201"]
    severity: warn
    then:
      function: schema
      field: headers
      functionOptions:
        interpolateErrorMessage: true
        schema:
          type: object
          required:
            - Location
          properties:
            Location:
              anyOf:
                - type: object
                  required:
                    - schema
                  properties:
                    description:
                      type: string
                      description: 'The URL of the created resource.'
                    schema:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [string]
                        format:
                          type: string
                          enum: [uri]
                        example:
                          type: string
                      required:
                        - type
                        - format
                - type: object
                  required:
                    - $ref
                  properties:
                    $ref:
                      type: string
    recommended: true
    description: '`201 Created` responses to `POST` methods SHOULD have a `Location` header identifying the location of the newly created resource.'
    message: '{{error}}'
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/should/should-have-location-header-in-201-response/

  # MUST Each operation MUST define 400, 404, and 500 responses using `application/problem+json` with examples.
  # => /docs/linting-rules/must/must-define-critical-problem-responses.md

  must-define-critical-problem-responses:
    description: "Operations must define 400, 404, 500 with examples and application/problem+json"
    message: "{{error}}"
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-define-critical-problem-responses/
    severity: warn
    given: $.paths[*][*]
    then:
      function: hasRequiredProblemDetailsErrorResponses
      functionOptions:
        mode: 'critical'

  # MUST Operations with their own non-empty `security` MUST define 401 and 403 responses using `application/problem+json` with examples.
  # => /docs/linting-rules/must/must-define-security-problem-responses.md

  must-define-security-problem-responses:
    description: "Operations with their own non-empty 'security' MUST define 401 and 403"
    message: "{{error}}"
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-define-security-problem-responses/
    severity: warn
    given: $.paths[*][*]
    then:
      function: hasRequiredProblemDetailsErrorResponses
      functionOptions:
        mode: 'explicit-security'

  # SHOULD include `x-contains-sensitive-data` boolean in the `info` object to indicate presence of sensitive data like PII or PHI.
  # => /docs/linting-rules/should/should-have-info-x-contains-sensitive-data.md

  should-have-info-x-contains-sensitive-data:
    given: $.info
    severity: warn
    then:
      - function: defined
        field: x-contains-sensitive-data
      - function: schema
        field: x-contains-sensitive-data
        functionOptions:
          schema:
            type: boolean
    recommended: true
    description: 'The `info` object SHOULD contain `x-contains-sensitive-data` to indicate presence of sensitive data such as PII or PHI.'
    message: "Missing or wrong 'info.x-contains-sensitive-data', should be 'boolean'."
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/should/should-have-info-x-contains-sensitive-data/

  # MAY include `info.x-api-type` to indicate API category; enforce enum values when present.
  # => /docs/linting-rules/may/may-have-info-x-api-type.md

  may-have-info-x-api-type:
    given: $.info
    severity: info
    then:
      - function: defined
        field: x-api-type
      - function: schema
        field: x-api-type
        functionOptions:
          schema:
            type: string
            enum:
              - standard
              - pygeoapi
    recommended: true
    description: 'APIs MAY include info.x-api-type to indicate API category. When present, it MUST be one of: standard, pygeoapi. When omitted, standard is assumed.'
    message: "Missing or wrong 'info.x-api-type'. Assuming 'standard'. Valid values: standard, pygeoapi."
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/may/may-have-info-x-api-type/

  # =====================================================================
  # pygeoapi-relaxed overrides
  #
  # When `info.x-api-type` is `pygeoapi`, the strict variants above are
  # gated to NOT fire (their `given` filters with `!== "pygeoapi"`), and
  # the paired `-pygeoapi` siblings below fire at `warn` instead. The
  # seven Zalando-inherited rules in this block are fully redefined here
  # so the strict variant carries the same gate as the new pygeoapi
  # sibling.
  # => /docs/linting-rules/severity-overrides.md
  # =====================================================================

  # Strict overrides for rules inherited from zalando.oas.rules.yml.
  must-specify-default-response: &must-specify-default-response
    given: $.paths.*.*[?(@property === "responses" && @root.info["x-api-type"] !== "pygeoapi")]
    severity: error
    then:
      function: truthy
      field: default
    description: Each `operation` must include a default error response that combines multiple errors.
    message: Operation does not contain a default response
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-specify-default-response/

  must-use-problem-json-as-default-response: &must-use-problem-json-as-default-response
    given: $.paths.*.*.responses.default[?(@property === "content" && @root.info["x-api-type"] !== "pygeoapi")]
    severity: error
    then:
      function: truthy
      field: application/problem+json
    description: The content type for the default response must be `application/problem+json`.
    message: Operation must use problem json as default response
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-use-problem-json-as-default-response/

  must-define-a-format-for-number-types: &must-define-a-format-for-number-types
    given: $.paths.*.*..schema..properties..[?(@ && @.type=='number' && @root.info["x-api-type"] !== "pygeoapi")]
    severity: error
    then:
      - function: defined
        field: format
      - function: pattern
        functionOptions:
          match: ^(float|double|decimal)$
        field: format
    description: '`number` properties must have a format defined (`float`, `double`, or `decimal`).'
    message: Numeric properties must have valid format specified
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-define-a-format-for-number-types/

  must-define-a-format-for-integer-types: &must-define-a-format-for-integer-types
    given: $.paths.*.*..schema..properties..[?(@ && @.type=='integer' && @root.info["x-api-type"] !== "pygeoapi")]
    severity: error
    then:
      - function: defined
        field: format
      - function: pattern
        functionOptions:
          match: ^(int32|int64|bigint)$
        field: format
    description: '`integer` properties must have a format defined (`int32`, `int64`, or `bigint`).'
    message: Numeric properties must have valid format specified
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-define-a-format-for-integer-types/

  must-use-problem-json-for-errors: &must-use-problem-json-for-errors
    given: $.paths.*[?(@root.info["x-api-type"] !== "pygeoapi")].responses['400','401','403','404','405','406','407','408','409','410','411','412','413','414','415','416','417','418','421','422','423','424','425','426','428','429','431','451','500','501','502','503','504','505','506','507','508','510','511','default'].content[*]~
    severity: error
    then:
      function: enumeration
      functionOptions:
        values:
          - application/problem+json
    description: The content type for 4xx and 5xx status codes must be `application/problem+json`.
    message: Error response must be application/problem+json
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-use-problem-json-for-errors/

  must-have-info-contact-email: &must-have-info-contact-email
    given: $.info[?(@property === "contact" && @root.info["x-api-type"] !== "pygeoapi")]
    severity: error
    then:
      function: truthy
      field: email
    description: The `info` object must have a `contact email` property that contains a valid email address for the responsible team.
    message: Must have email defined in `info.contact.email`
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-have-info-contact-email/

  must-have-info-version: &must-have-info-version
    given: $.info[?(@property === "title" && @root.info["x-api-type"] !== "pygeoapi")]^
    severity: error
    then:
      - function: defined
        field: version
      - function: schema
        functionOptions:
          schema:
            type: string
            pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$
        field: version
    description: The `info` object must have a `version` property that follows [semantic rules](http://semver.org/spec/v2.0.0.html) to distinguish API versions.
    message: Must have API version defined in `info.version`
    documentationUrl: https://ukhsa-collaboration.github.io/standards-org/api-design-guidelines/linting-rules/must/must-have-info-version/

  # pygeoapi siblings — each inherits the strict definition but flips the
  # gate to `=== "pygeoapi"` and downgrades severity to `warn`.
  must-use-camel-case-for-property-names-pygeoapi:
    <<: *must-use-camel-case-for-property-names
    given: $.paths.*.*['responses','requestBody']..content..schema..properties[?(@root.info["x-api-type"] === "pygeoapi")]~
    severity: warn

  must-use-camel-case-for-query-parameters-pygeoapi:
    <<: *must-use-camel-case-for-query-parameters
    given: $.paths.*.*.parameters[?(@ && @.in=='query' && @root.info["x-api-type"] === "pygeoapi")].name
    severity: warn

  must-have-info-api-audience-pygeoapi:
    <<: *must-have-info-api-audience-defined
    given: $.info[?(@property === "title" && @root.info["x-api-type"] === "pygeoapi")]^
    severity: warn

  must-have-info-api-audience-pygeoapi-invalid:
    <<: *must-have-info-api-audience
    given: $.info[?(@property === "title" && @root.info["x-api-type"] === "pygeoapi")]^
    severity: warn

  must-use-valid-version-info-schema-pygeoapi:
    <<: *must-use-valid-version-info-schema
    given: $.paths["/"].*.responses["200"].content[?(@property === "application/json" && @root.info["x-api-type"] === "pygeoapi")]
    severity: warn

  must-have-info-value-chain-pygeoapi:
    <<: *must-have-info-value-chain-defined
    given: $.info[?(@property === "title" && @root.info["x-api-type"] === "pygeoapi")]^
    severity: warn

  must-have-info-value-chain-pygeoapi-invalid:
    <<: *must-have-info-value-chain
    given: $.info[?(@property === "title" && @root.info["x-api-type"] === "pygeoapi")]^
    severity: warn

  must-use-https-protocol-only-pygeoapi:
    <<: *must-use-https-protocol-only
    given: $.servers..[?(@property === "url" && @root.info["x-api-type"] === "pygeoapi")]
    severity: warn

  must-define-security-schemes-pygeoapi:
    <<: *must-define-security-schemes
    given: $..[?(@property === "components" && @root.info["x-api-type"] === "pygeoapi")]
    severity: warn

  must-specify-default-response-pygeoapi:
    <<: *must-specify-default-response
    given: $.paths.*.*[?(@property === "responses" && @root.info["x-api-type"] === "pygeoapi")]
    severity: warn

  must-use-problem-json-as-default-response-pygeoapi:
    <<: *must-use-problem-json-as-default-response
    given: $.paths.*.*.responses.default[?(@property === "content" && @root.info["x-api-type"] === "pygeoapi")]
    severity: warn

  must-define-a-format-for-number-types-pygeoapi:
    <<: *must-define-a-format-for-number-types
    given: $.paths.*.*..schema..properties..[?(@ && @.type=='number' && @root.info["x-api-type"] === "pygeoapi")]
    severity: warn

  must-define-a-format-for-integer-types-pygeoapi:
    <<: *must-define-a-format-for-integer-types
    given: $.paths.*.*..schema..properties..[?(@ && @.type=='integer' && @root.info["x-api-type"] === "pygeoapi")]
    severity: warn

  must-use-problem-json-for-errors-pygeoapi:
    <<: *must-use-problem-json-for-errors
